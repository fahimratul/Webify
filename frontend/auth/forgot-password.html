<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEBIFY - Forgot Password</title>
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="../css/notificationtoast.css">
</head>

<body>
    <!-- ============================================
         NOTIFICATION SYSTEM
         Toast notifications for user feedback
         ============================================ -->
    <div id="notification-toast" class="notification-toast"></div>

    <!-- ============================================
         MAIN CONTAINER
         Root container for the entire page
         ============================================ -->
    <div class="container">
        
        <!-- ============================================
             ANIMATED BACKGROUND EFFECTS
             Floating blobs and geometric shapes for visual interest
             ============================================ -->
        <div class="background-effects">
            <!-- Gradient blob animations -->
            <div class="blob blob-1"></div>
            <div class="blob blob-2"></div>
            <div class="blob blob-3"></div>
            
            <!-- Geometric shape decorations -->
            <div class="geometric-shape shape-1"></div>
            <div class="geometric-shape shape-2"></div>
            <div class="geometric-shape shape-3"></div>
        </div>

        <!-- ============================================
             NOISE TEXTURE OVERLAY
             Adds subtle grain effect for depth
             ============================================ -->
        <div class="noise-overlay"></div>

        <!-- ============================================
             MAIN CONTENT AREA
             Contains the centered forgot password form
             ============================================ -->
        <div class="main-content">
            <div class="content-grid-centered">
                
                <!-- ============================================
                     FORGOT PASSWORD SECTION
                     Complete forgot password flow UI
                     ============================================ -->
                <div class="forgot-password-section">
                    
                    <!-- ============================================
                         BACK NAVIGATION
                         Link to return to login page
                         ============================================ -->
                    <a href="login.html" class="back-button">
                        <!-- Left arrow icon -->
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <line x1="19" y1="12" x2="5" y2="12"></line>
                            <polyline points="12 19 5 12 12 5"></polyline>
                        </svg>
                        <span>Back to Sign In</span>
                    </a>

                    <!-- ============================================
                         LOGO SECTION
                         Brand identity with icon and text
                         ============================================ -->
                    <div class="forgot-logo-container">
                        <!-- Logo icon with custom SVG -->
                        <div class="logo-icon-forgot">
                            <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <!-- Abstract W shape for WEBIFY -->
                                <path d="M10 8 L10 32 L18 24 L10 32" stroke="white" stroke-width="4"
                                    stroke-linecap="round" stroke-linejoin="round" />
                                <path d="M22 8 L22 20 L30 12 L22 20" stroke="white" stroke-width="4"
                                    stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                        </div>
                        <!-- Brand name -->
                        <h1 class="logo-text-forgot">WEBIFY</h1>
                    </div>

                    <!-- ============================================
                         GLASSMORPHIC CARD
                         Main container for forgot password form
                         Uses glassmorphism design pattern
                         ============================================ -->
                    <div class="glass-card forgot-card">
                        
                        <!-- ============================================
                             VISUAL ICON
                             Lock with open state to represent password reset
                             ============================================ -->
                        <div class="forgot-icon-circle">
                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <!-- Lock body -->
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <!-- Open shackle indicating unlocking -->
                                <path d="M7 11V7a5 5 0 0 1 9.9-1"></path>
                            </svg>
                        </div>

                        <!-- ============================================
                             FORM HEADER
                             Title and description for password reset
                             ============================================ -->
                        <div class="form-header text-center">
                            <h2 class="form-title">Forgot Password?</h2>
                            <p class="form-subtitle">No worries! Enter your email and we'll send you a reset link</p>
                        </div>

                        <!-- ============================================
                             FORGOT PASSWORD FORM
                             Main form for email submission
                             ============================================ -->
                        <form id="forgotPasswordForm" class="auth-form">
                            
                            <!-- ============================================
                                 EMAIL INPUT FIELD
                                 User enters their registered email address
                                 ============================================ -->
                            <div class="form-group">
                                <label for="forgot-email" class="form-label">Email Address</label>
                                
                                <!-- Input wrapper with icon -->
                                <div class="input-wrapper">
                                    <!-- Email icon (envelope) -->
                                    <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
                                        stroke="currentColor" stroke-width="2">
                                        <path
                                            d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z">
                                        </path>
                                        <polyline points="22,6 12,13 2,6"></polyline>
                                    </svg>
                                    
                                    <!-- Email input field -->
                                    <input 
                                        type="email" 
                                        id="forgot-email" 
                                        class="form-input"
                                        placeholder="your.email@example.com" 
                                        required
                                        aria-describedby="forgot-email-error">
                                </div>
                                
                                <!-- Error message display area -->
                                <span class="error-message" id="forgot-email-error" role="alert"></span>
                            </div>

                            <!-- ============================================
                                 SUBMIT BUTTON
                                 Triggers password reset email
                                 ============================================ -->
                            <button type="submit" class="submit-btn forgot-btn">
                                <span>Send Reset Link</span>
                                <!-- Right arrow icon -->
                                <svg class="arrow-icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2">
                                    <line x1="5" y1="12" x2="19" y2="12"></line>
                                    <polyline points="12 5 19 12 12 19"></polyline>
                                </svg>
                            </button>
                        </form>

                        <!-- ============================================
                             HELP TEXT
                             Link back to login if user remembers password
                             ============================================ -->
                        <div class="help-text">
                            <p>Remember your password? <a href="login.html" class="signup-link">Sign In</a></p>
                        </div>
                    </div>
                    <!-- End glassmorphic card -->
                </div>
                <!-- End forgot password section -->
            </div>
            <!-- End content grid -->
        </div>
        <!-- End main content -->
    </div>
    <!-- End container -->

    <!-- ============================================
         JAVASCRIPT
         Handles form submission and validation
         ============================================ -->
    <script src="forgot-password.js"></script>
</body>

</html>
